<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción | Corriendo por salud</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/estilos.css?v=12">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg menu">
      <div class="container">
        <a class="navbar-brand" href="index.html">Corriendo por salud</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="entrenamiento.html">Entrenamiento</a></li>
            <li class="nav-item"><a class="nav-link" href="carreras.html">Carreras</a></li>
            <li class="nav-item"><a class="nav-link" href="consejos.html">Consejos</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="inscripcion.html">Inscripción</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>

    <section class="seccion">
      <div class="container">
        <h1>Inscripción</h1>
        <p>Llena el formulario para unirte al grupo.</p>

        <div class="row">
          <div class="col-12 col-lg-8">
            <form id="formInscripcion" novalidate>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" required minlength="5">
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" class="form-control" id="correo" required>
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="telefono" required pattern="[0-9]{10}" maxlength="10">
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="distancia" class="form-label">Distancia</label>
                <select class="form-select" id="distancia" required>
                  <option value="">Selecciona...</option>
                  <option value="5K">5K</option>
                  <option value="10K">10K</option>
                  <option value="21K">21K</option>
                  <option value="42K">42K</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <p class="mb-1">Nivel</p>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="nivel" id="nivel1" value="principiante" required>
                  <label class="form-check-label" for="nivel1">Principiante</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="nivel" id="nivel2" value="intermedio">
                  <label class="form-check-label" for="nivel2">Intermedio</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="nivel" id="nivel3" value="avanzado">
                  <label class="form-check-label" for="nivel3">Avanzado</label>
                </div>
                <div id="errorNivel" class="invalid-feedback">Elige tu nivel.</div>
              </div>

              <div class="mb-3">
                <label for="objetivo" class="form-label">¿Por qué quieres correr?</label>
                <textarea class="form-control" id="objetivo" rows="3" required minlength="10"></textarea>
                <div class="invalid-feedback"></div>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="terminos" required>
                <label class="form-check-label" for="terminos">Acepto el reglamento</label>
                <div class="invalid-feedback"></div>
              </div>

              <button type="submit" class="btn btn-rojo">Enviar</button>
            </form>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
  <script src="../js/funtion.js?v=12"></script>
</body>
</html>
